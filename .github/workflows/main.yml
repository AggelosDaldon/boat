name: Forge 1.20.1 build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge mod
        run: gradle build --stacktrace --console plain
      - name: Verify Forge JAR resources
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)
          test -n "$JAR_PATH"
          jar tf "$JAR_PATH" | grep -qx 'pack.mcmeta'
          jar tf "$JAR_PATH" | grep -qx 'META-INF/mods.toml'
          jar tf "$JAR_PATH" | grep -qx 'LICENSE_boatism'
          echo "Verified pack.mcmeta and mods.toml in $JAR_PATH"
      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boatism-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
